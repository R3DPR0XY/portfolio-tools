<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R3DPR0XY Release Rail</title>
  <style>
    :root {
      --void: #0f1117;
      --panel: #f4f1ea;
      --steel: #475569;
      --signal: #e23d28;
      --reactor: #00a6a6;
      --ash: #d7d1c5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(15,17,23,0.04) 1px, transparent 1px),
        linear-gradient(rgba(15,17,23,0.04) 1px, transparent 1px),
        var(--panel);
      background-size: 24px 24px;
      color: var(--void);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 48px 28px;
    }

    main {
      width: min(1120px, 100%);
    }

    .mark {
      color: var(--signal);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      margin: 0 0 10px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1;
      margin: 0 0 10px;
      max-width: 760px;
    }

    .claim {
      color: var(--steel);
      font-size: 15px;
      margin: 0 0 28px;
      max-width: 760px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 900px;
      background: rgba(244,241,234,0.88);
      border: 1px solid rgba(15,17,23,0.16);
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">R3DPR0XY FORGE MAP / RELEASE RAIL</p>
    <h1>Portfolio GitHub Actions rail</h1>
    <p class="claim">A release-ready path from repository change to tested JAR artifacts and public GitHub releases.</p>

    <svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="release-rail-title release-rail-desc">
      <title id="release-rail-title">Portfolio GitHub Actions Release Rail</title>
      <desc id="release-rail-desc">R3DPR0XY release rail showing triggers, runner setup, Gradle and Maven builds, artifact packaging, and GitHub release output.</desc>

      <defs>
        <marker id="signal-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M0,0 L10,4 L0,8 Z" fill="#e23d28"/>
        </marker>
        <marker id="steel-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
        </marker>
        <marker id="reactor-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M0,0 L10,4 L0,8 Z" fill="#00a6a6"/>
        </marker>
      </defs>

      <rect width="1120" height="560" fill="#f4f1ea"/>

      <line x1="72" y1="160" x2="1048" y2="160" stroke="#d7d1c5" stroke-width="1"/>
      <line x1="72" y1="408" x2="1048" y2="408" stroke="#d7d1c5" stroke-width="1"/>

      <text x="72" y="92" fill="#0f1117" font-size="12" font-weight="800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="0.16em">PRIMARY CI RAIL</text>
      <text x="72" y="388" fill="#0f1117" font-size="12" font-weight="800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="0.16em">RELEASE RAIL</text>

      <path d="M 168 240 H 312 H 456 H 616 H 776 H 928" fill="none" stroke="#e23d28" stroke-width="4" marker-end="url(#signal-arrow)"/>
      <path d="M 168 456 H 320 H 544 H 768 H 928" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#steel-arrow)"/>
      <path d="M 776 288 V 344 Q 776 356 788 356 H 928 V 408" fill="none" stroke="#00a6a6" stroke-width="2" marker-end="url(#reactor-arrow)"/>

      <g>
        <rect x="72" y="188" width="152" height="104" rx="8" fill="#fffaf0" stroke="#0f1117" stroke-width="1.2"/>
        <rect x="88" y="204" width="60" height="18" rx="2" fill="#0f1117"/>
        <text x="118" y="217" fill="#f4f1ea" font-size="8" font-weight="800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">TRIGGER</text>
        <text x="148" y="244" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Repo change</text>
        <text x="148" y="264" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">push / PR / manual</text>
      </g>

      <g>
        <rect x="264" y="188" width="152" height="104" rx="8" fill="#fffaf0" stroke="#0f1117" stroke-width="1.2"/>
        <rect x="280" y="204" width="56" height="18" rx="2" fill="#0f1117"/>
        <text x="308" y="217" fill="#f4f1ea" font-size="8" font-weight="800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">RUNNER</text>
        <text x="340" y="244" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Ubuntu lane</text>
        <text x="340" y="264" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">checkout + Java 21</text>
      </g>

      <g>
        <rect x="456" y="176" width="184" height="128" rx="8" fill="rgba(226,61,40,0.08)" stroke="#e23d28" stroke-width="1.6"/>
        <rect x="472" y="192" width="64" height="18" rx="2" fill="#e23d28"/>
        <text x="504" y="205" fill="#fffaf0" font-size="8" font-weight="800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">BUILD</text>
        <text x="548" y="236" fill="#0f1117" font-size="16" font-weight="800" text-anchor="middle">Gradle matrix</text>
        <text x="548" y="258" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">BrewBloom / Kagerov</text>
        <text x="548" y="276" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">Saturation / Betterchat / LootPanel</text>
      </g>

      <g>
        <rect x="696" y="188" width="160" height="104" rx="8" fill="#fffaf0" stroke="#0f1117" stroke-width="1.2"/>
        <rect x="712" y="204" width="64" height="18" rx="2" fill="#0f1117"/>
        <text x="744" y="217" fill="#f4f1ea" font-size="8" font-weight="800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">MAVEN</text>
        <text x="776" y="244" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Plugin package</text>
        <text x="776" y="264" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">MPersonagem JAR</text>
      </g>

      <g>
        <rect x="904" y="188" width="144" height="104" rx="8" fill="rgba(0,166,166,0.08)" stroke="#00a6a6" stroke-width="1.4"/>
        <rect x="920" y="204" width="64" height="18" rx="2" fill="#00a6a6"/>
        <text x="952" y="217" fill="#fffaf0" font-size="8" font-weight="800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">OUTPUT</text>
        <text x="976" y="244" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">CI artifacts</text>
        <text x="976" y="264" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">upload-artifact@v4</text>
      </g>

      <g>
        <rect x="72" y="424" width="152" height="80" rx="8" fill="#fffaf0" stroke="#475569" stroke-width="1.2"/>
        <text x="148" y="456" fill="#0f1117" font-size="14" font-weight="800" text-anchor="middle">Release event</text>
        <text x="148" y="476" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">published / manual</text>
      </g>

      <g>
        <rect x="320" y="424" width="184" height="80" rx="8" fill="#fffaf0" stroke="#475569" stroke-width="1.2"/>
        <text x="412" y="456" fill="#0f1117" font-size="14" font-weight="800" text-anchor="middle">Rebuild targets</text>
        <text x="412" y="476" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">Gradle mods + Maven plugin</text>
      </g>

      <g>
        <rect x="560" y="424" width="160" height="80" rx="8" fill="#fffaf0" stroke="#475569" stroke-width="1.2"/>
        <text x="640" y="456" fill="#0f1117" font-size="14" font-weight="800" text-anchor="middle">Collect bundle</text>
        <text x="640" y="476" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">dist/*.jar</text>
      </g>

      <g>
        <rect x="792" y="424" width="180" height="80" rx="8" fill="rgba(0,166,166,0.08)" stroke="#00a6a6" stroke-width="1.4"/>
        <text x="882" y="456" fill="#0f1117" font-size="14" font-weight="800" text-anchor="middle">GitHub Release</text>
        <text x="882" y="476" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">release-jars + attached assets</text>
      </g>

      <rect x="72" y="40" width="128" height="28" rx="4" fill="#0f1117"/>
      <text x="136" y="59" fill="#f4f1ea" font-size="10" font-weight="900" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">R3DPR0XY MAP</text>

      <rect x="732" y="40" width="316" height="28" rx="4" fill="rgba(15,17,23,0.06)" stroke="#d7d1c5"/>
      <text x="748" y="59" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">2 workflows / 6 build targets / JAR release output</text>

      <line x1="72" y1="532" x2="1048" y2="532" stroke="#d7d1c5" stroke-width="1"/>
      <text x="72" y="548" fill="#475569" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">signal = critical CI path</text>
      <text x="284" y="548" fill="#475569" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">dashed = release-only rebuild</text>
      <text x="532" y="548" fill="#475569" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">reactor = public artifact output</text>
    </svg>
  </main>
</body>
</html>
