<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPersonagem Runtime Core</title>
  <style>
    :root { --void:#0f1117; --panel:#f4f1ea; --steel:#475569; --signal:#e23d28; --reactor:#00a6a6; --ash:#d7d1c5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:48px 28px; background:var(--panel); color:var(--void); font-family:Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width:min(1120px,100%); }
    .mark { margin:0 0 10px; color:var(--signal); font:800 12px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0 0 10px; font-size:clamp(30px,4vw,44px); line-height:1; }
    .claim { margin:0 0 28px; color:var(--steel); font-size:15px; max-width:760px; }
    svg { width:100%; min-width:900px; display:block; border:1px solid rgba(15,17,23,.16); background:rgba(244,241,234,.9); }
  </style>
</head>
<body>
  <main>
    <p class="mark">R3DPR0XY FORGE MAP / RUNTIME CORE</p>
    <h1>MPersonagem runtime core</h1>
    <p class="claim">A Paper plugin core that turns commands and server hooks into persistent roleplay character profiles.</p>
    <svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mpersonagem-core-title mpersonagem-core-desc">
      <title id="mpersonagem-core-title">MPersonagem Runtime Core</title>
      <desc id="mpersonagem-core-desc">Runtime Core map for MPersonagem showing player commands, admin commands, plugin services, character storage, PlaceholderAPI hooks, and gameplay identity output.</desc>
      <defs>
        <marker id="sig" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e23d28"/></marker>
        <marker id="stl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
        <marker id="rea" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#00a6a6"/></marker>
      </defs>
      <rect width="1120" height="560" fill="#f4f1ea"/>
      <path d="M272 240 H416" fill="none" stroke="#e23d28" stroke-width="4" marker-end="url(#sig)"/>
      <path d="M704 240 H848" fill="none" stroke="#e23d28" stroke-width="4" marker-end="url(#sig)"/>
      <path d="M560 176 V112" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#stl)"/>
      <path d="M560 304 V396" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#stl)"/>
      <path d="M704 272 H784 Q800 272 800 288 V396" fill="none" stroke="#00a6a6" stroke-width="2" marker-end="url(#rea)"/>

      <g><rect x="88" y="184" width="184" height="112" rx="8" fill="#fffaf0" stroke="#0f1117"/><rect x="104" y="200" width="64" height="18" rx="2" fill="#0f1117"/><text x="136" y="213" fill="#f4f1ea" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">INPUT</text><text x="180" y="240" fill="#0f1117" font-size="16" font-weight="900" text-anchor="middle">Player commands</text><text x="180" y="262" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">/personagem /id</text></g>
      <g><rect x="432" y="160" width="272" height="160" rx="10" fill="rgba(226,61,40,.08)" stroke="#e23d28" stroke-width="1.8"/><rect x="452" y="180" width="72" height="18" rx="2" fill="#e23d28"/><text x="488" y="193" fill="#fffaf0" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">CORE</text><text x="568" y="232" fill="#0f1117" font-size="20" font-weight="900" text-anchor="middle">Character system</text><text x="568" y="260" fill="#475569" font-size="11" font-family="monospace" text-anchor="middle">menus / attributes / prompts</text><text x="568" y="280" fill="#475569" font-size="11" font-family="monospace" text-anchor="middle">CharacterSystemPlugin</text></g>
      <g><rect x="848" y="184" width="184" height="112" rx="8" fill="rgba(0,166,166,.08)" stroke="#00a6a6" stroke-width="1.4"/><rect x="864" y="200" width="72" height="18" rx="2" fill="#00a6a6"/><text x="900" y="213" fill="#fffaf0" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">RESULT</text><text x="940" y="240" fill="#0f1117" font-size="16" font-weight="900" text-anchor="middle">RP identity</text><text x="940" y="262" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">name / age / height</text></g>
      <g><rect x="432" y="48" width="272" height="88" rx="8" fill="#fffaf0" stroke="#475569"/><text x="568" y="84" fill="#0f1117" font-size="15" font-weight="900" text-anchor="middle">Admin lane</text><text x="568" y="106" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">/mpersonagem /pularano permissions</text></g>
      <g><rect x="416" y="396" width="184" height="96" rx="8" fill="#fffaf0" stroke="#475569"/><text x="508" y="436" fill="#0f1117" font-size="15" font-weight="900" text-anchor="middle">Character store</text><text x="508" y="458" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">persistent profiles</text></g>
      <g><rect x="696" y="396" width="184" height="96" rx="8" fill="#fffaf0" stroke="#00a6a6"/><text x="788" y="436" fill="#0f1117" font-size="15" font-weight="900" text-anchor="middle">Soft hooks</text><text x="788" y="458" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">PlaceholderAPI / TAB</text></g>

      <rect x="80" y="516" width="960" height="28" rx="4" fill="rgba(15,17,23,.06)" stroke="#d7d1c5"/>
      <text x="104" y="535" fill="#475569" font-size="10" font-family="monospace">Paper API 1.21.4</text>
      <text x="264" y="535" fill="#475569" font-size="10" font-family="monospace">Java 21</text>
      <text x="372" y="535" fill="#475569" font-size="10" font-family="monospace">Maven</text>
      <text x="468" y="535" fill="#475569" font-size="10" font-family="monospace">MPersonagem-1.0.0.jar</text>
      <text x="704" y="535" fill="#475569" font-size="10" font-family="monospace">author: R3DPR0XY</text>
    </svg>
  </main>
</body>
</html>
