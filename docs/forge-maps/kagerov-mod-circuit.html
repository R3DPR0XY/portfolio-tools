<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kagerov Mod Circuit</title>
  <style>
    :root { --void:#0f1117; --panel:#f4f1ea; --steel:#475569; --signal:#e23d28; --reactor:#00a6a6; --ash:#d7d1c5; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:48px 28px; background:var(--panel); color:var(--void); font-family:Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width:min(1120px, 100%); }
    .mark { margin:0 0 10px; color:var(--signal); font:800 12px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0 0 10px; font-size:clamp(30px,4vw,44px); line-height:1; }
    .claim { margin:0 0 28px; color:var(--steel); font-size:15px; max-width:760px; }
    svg { width:100%; min-width:900px; display:block; border:1px solid rgba(15,17,23,.16); background:rgba(244,241,234,.9); }
  </style>
</head>
<body>
  <main>
    <p class="mark">R3DPR0XY FORGE MAP / MOD CIRCUIT</p>
    <h1>Kagerov Fabric mod circuit</h1>
    <p class="claim">A client-side Minecraft mod path from Fabric loader to book tools, symbols, mixins, language assets, and remapped JAR output.</p>
    <svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kagerov-circuit-title kagerov-circuit-desc">
      <title id="kagerov-circuit-title">Kagerov Mod Circuit</title>

        <marker id="rea" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#00a6a6"/></marker>
      </defs>
      <rect width="1120" height="560" fill="#f4f1ea"/>
      <path d="M112 272 H260 Q280 272 280 252 V188 Q280 168 300 168 H460 Q480 168 480 188 V252 Q480 272 500 272 H676 Q696 272 696 252 V188 Q696 168 716 168 H888" fill="none" stroke="#e23d28" stroke-width="4" marker-end="url(#sig)"/>
      <path d="M696 272 V356 Q696 376 716 376 H916" fill="none" stroke="#00a6a6" stroke-width="3" marker-end="url(#rea)"/>
      <path d="M480 272 V376 H304" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>

      <g><rect x="64" y="220" width="144" height="104" rx="8" fill="#fffaf0" stroke="#0f1117"/><rect x="80" y="236" width="64" height="18" rx="2" fill="#0f1117"/><text x="112" y="249" fill="#f4f1ea" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">LOADER</text><text x="136" y="276" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Fabric loader</text><text x="136" y="296" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">>=0.16.5</text></g>
      <g><rect x="300" y="116" width="168" height="104" rx="8" fill="#fffaf0" stroke="#0f1117"/><rect x="316" y="132" width="80" height="18" rx="2" fill="#0f1117"/><text x="356" y="145" fill="#f4f1ea" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">ENTRYPOINT</text><text x="384" y="172" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Kagerov init</text><text x="384" y="192" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">main + client</text></g>
      <g><rect x="304" y="336" width="168" height="104" rx="8" fill="#fffaf0" stroke="#475569"/><rect x="320" y="352" width="56" height="18" rx="2" fill="#475569"/><text x="348" y="365" fill="#f4f1ea" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">PATCH</text><text x="388" y="392" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Mixin layer</text><text x="388" y="412" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">book/chat/sign hooks</text></g>
      <g><rect x="548" y="204" width="200" height="136" rx="8" fill="rgba(226,61,40,.08)" stroke="#e23d28" stroke-width="1.6"/><rect x="564" y="220" width="64" height="18" rx="2" fill="#e23d28"/><text x="596" y="233" fill="#fffaf0" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">FEATURE</text><text x="648" y="264" fill="#0f1117" font-size="17" font-weight="900" text-anchor="middle">Book toolkit</text><text x="648" y="286" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">reader / editor / library</text><text x="648" y="304" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">symbols + text palette</text></g>
      <g><rect x="784" y="116" width="160" height="104" rx="8" fill="#fffaf0" stroke="#0f1117"/><rect x="800" y="132" width="56" height="18" rx="2" fill="#0f1117"/><text x="828" y="145" fill="#f4f1ea" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">ASSET</text><text x="864" y="172" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Lang + icon</text><text x="864" y="192" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">en_us / pt_br</text></g>
      <g><rect x="916" y="336" width="152" height="104" rx="8" fill="rgba(0,166,166,.08)" stroke="#00a6a6" stroke-width="1.4"/><rect x="932" y="352" width="44" height="18" rx="2" fill="#00a6a6"/><text x="954" y="365" fill="#fffaf0" font-size="8" font-weight="800" font-family="monospace" text-anchor="middle">JAR</text><text x="992" y="392" fill="#0f1117" font-size="15" font-weight="800" text-anchor="middle">Remapped JAR</text><text x="992" y="412" fill="#475569" font-size="10" font-family="monospace" text-anchor="middle">kagerov-1.0.0</text></g>

      <rect x="64" y="488" width="992" height="32" rx="4" fill="rgba(15,17,23,.06)" stroke="#d7d1c5"/>
      <text x="88" y="509" fill="#475569" font-size="10" font-family="monospace">Minecraft 1.21.8</text>
      <text x="260" y="509" fill="#475569" font-size="10" font-family="monospace">Java 21</text>
      <text x="380" y="509" fill="#475569" font-size="10" font-family="monospace">Fabric API 0.129.0+1.21.8</text>
      <text x="652" y="509" fill="#475569" font-size="10" font-family="monospace">MIT</text>
      <text x="748" y="509" fill="#475569" font-size="10" font-family="monospace">R3DPR0XY</text>
    </svg>
  </main>
</body>
</html>
