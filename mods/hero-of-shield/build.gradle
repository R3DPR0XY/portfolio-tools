plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'CottonMC'
        url = 'https://alexiil.uk/mirrors/staging.alexiil.uk/maven/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modImplementation include("io.github.cottonmc:LibGui:14.0.0+1.21.6")
    implementation include("com.googlecode.soundlibs:mp3spi:1.9.5.4")
    implementation include("com.googlecode.soundlibs:jlayer:1.0.1.4")
    implementation include("com.googlecode.soundlibs:tritonus-share:0.3.7.4")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// This project ships no automated tests yet. On this environment, Gradle fails
// while instantiating the default Test task, so keep the build lifecycle focused
// on assembling the distributable artifacts.
tasks.named("check") {
    setDependsOn([])
}

tasks.named("build") {
    setDependsOn([tasks.named("assemble")])
}
