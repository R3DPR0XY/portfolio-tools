name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle-mods:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BrewBloom
            path: mods/brewbloom
          - name: Kagerov
            path: mods/kagerov
          - name: SaturationMod
            path: mods/saturationmod
          - name: Betterchat
            path: mods/betterchat
          - name: LootPanel
            path: mods/lootpanel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: ${{ matrix.path }}
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-jar
          path: |
            ${{ matrix.path }}/build/libs/*.jar
            !${{ matrix.path }}/build/libs/*-sources.jar
          if-no-files-found: error

  maven-plugins:
    name: Build MPersonagem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin
        run: mvn -B package --file plugins/mpersonagem/pom.xml

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPersonagem-jar
          path: plugins/mpersonagem/target/*.jar
          if-no-files-found: error

