name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Gradle mods
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            mods/brewbloom \
            mods/kagerov \
            mods/saturationmod \
            mods/betterchat \
            mods/lootpanel
          do
            echo "::group::Build ${project}"
            (cd "${project}" && bash ./gradlew build --no-daemon --stacktrace)
            echo "::endgroup::"
          done

      - name: Build Maven plugins
        run: mvn -B package --file plugins/mpersonagem/pom.xml

      - name: Collect jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find mods -path '*/build/libs/*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          find plugins -path '*/target/*.jar' -exec cp {} dist/ \;
          ls -la dist

      - name: Package Forge Maps skill
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          zip -r "dist/r3dpr0xy-forge-maps-${version}.zip" \
            skills/r3dpr0xy-forge-maps \
            docs/forge-maps \
            docs/release-notes-v0.1.0.md \
            CHANGELOG.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Attach jars to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
